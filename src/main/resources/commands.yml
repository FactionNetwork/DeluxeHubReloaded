# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~#
# | CUSTOM COMMANDS                          |
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~#
version: 3.7.0
custom_commands:

  # Command name, this will be used as the main command
  website:
    # List any aliases for the command here
    aliases:
      - web
    # Actions to be executed
    actions:
      - '[MESSAGE] &bWebsite: &fwww.examplemc.net'
  clearinventory:
    # Players will require this permission to execute this command.
    permission: deluxehub.clearinventory
    aliases:
      - ci
    actions:
      - '[CONSOLE] minecraft:clear %player%'
      - '[MESSAGE] &dDeluxeHubReloaded &eYour inventory has been cleared!'

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~#
# | DELUXEHUB COMMANDS                       |
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~#
# It's highly recommended to restart your server if you edit anything below

commands:
  clearchat:
    enabled: true
  fly:
    enabled: true
  lockchat:
    enabled: true
    aliases:
      - lc
  setlobby:
    enabled: true
  lobby:
    enabled: true
  buildmode:
    enabled: true
    aliases:
      - build